[package]
name = "tensormesh"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
[workspace]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "0.20.1"
pooled-core = { path = "../../rust/pooled-core" }
pooled-native = { path = "../../rust/pooled-native" }
