name: TensorMesh desktop
on:
  workflow_dispatch:
  pull_request:
    paths: ['tensormesh/**', 'rust/**', '.github/workflows/tensormesh.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tensormesh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tensormesh/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Frontend checks
        run: |
          npm test
          npm run build
      - name: Native checks
        run: cargo +stable test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        run: npm run tauri build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tensormesh-windows
          path: tensormesh/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
